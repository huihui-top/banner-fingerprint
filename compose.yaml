services:
  server:
    build:
      context: .
      target: server
    command: ["serve"]
    environment:
      LISTEN_ADDR: ":8080"
      RULES_FILE: "/app/rules/fingerprints.json"
    ports:
      - "127.0.0.1:8080:8080"
    networks: [fingerprint]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./rules:/app/rules:ro
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck", "--url", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: "on-failure:3"
    stop_grace_period: 35s
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  client:
    build:
      context: .
      target: client
    command: ["--server", "http://server:8080", "--input", "/data/input.json"]
    networks: [fingerprint]
    depends_on:
      server:
        condition: service_healthy
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./samples:/data:ro
    restart: "no"
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  fingerprint:
    driver: bridge
    internal: true
